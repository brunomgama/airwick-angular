<h2>PROJECT DETAILS WORKS</h2>

<ul>
  @if (project(); as p) {
    <p>ID: {{ p.id }}</p>
    <p>Name: {{ p.name }}</p>
    <mat-form-field class="example-form-field">
      <input
        matInput
        type="text"
        [(ngModel)]="projectTitle">
    </mat-form-field>
  }
</ul>

<div class="example-button-row">
  <button (click)="updateProject()" matButton>Update</button>
</div>

<h2> PROJECTS </h2>

<ul>
  @for (project of projectList(); track project.id) {
    <li>{{ project.name }}</li>
  }
</ul>

<div class="example-button-row">
  <button (click)=createTestRequest() matButton>Basic</button>
</div>


<mat-form-field class="example-form-field">
  <mat-label>Project title</mat-label>
  <input
    matInput
    type="text"
    [(ngModel)]="projectTitle">
</mat-form-field>
